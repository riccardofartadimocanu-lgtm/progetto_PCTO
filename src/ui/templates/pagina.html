<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mock Pipeline Editor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<div id="pointModal" class="hidden modal">
    <div class="modal-content">
        <h3>Nuovo punto</h3>

        <label>Xm</label>
        <input id="xmInput" type="number" step="any">

        <label>Ym</label>
        <input id="ymInput" type="number" step="any">

        <div class="modal-buttons">
            <button id="savePointBtn">Conferma</button>
            <button id="cancelPointBtn">Annulla</button>
        </div>
    </div>
</div>
<body>

<div class="sidebar">

    <div class="toolbar">
        <button id="loadBtn">Carica immagine</button>
        <button id="editBtn">Edit OFF</button>
        <button id="saveBtn">Save</button>
        <input type="file" id="fileInput" hidden>
    </div>

    <div class="tableBox">
        <table id="pointsTable">
            <thead>
                <tr>
                    <th>Xp</th>
                    <th>Yp</th>
                    <th>Xm</th>
                    <th>Ym</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
    </div>
    <button id="clearBtn">Pulisci punti</button>
    <button id="loadSaveBtn">
    Carica salvataggio
</button>

</div>

<div id="workspace">
    <canvas id="canvas"></canvas>
    <div id="debug"></div>
    <div id="cursorCoords">X: 0 Y: 0</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3>Eliminare punto?</h3>
        <p id="modal-text"></p>

        <div class="modal-actions">
            <button id="cancelBtn">Annulla</button>
            <button id="deleteBtn">Elimina</button>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
