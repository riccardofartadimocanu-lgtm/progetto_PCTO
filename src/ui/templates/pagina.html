<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mock Pipeline Editor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="sidebar">

    <div class="toolbar">
        <button id="loadBtn">Carica immagine</button>
        <button id="editBtn">Edit OFF</button>
        <button id="saveBtn">Save</button>
        <input type="file" id="fileInput" hidden>
    </div>

    <div class="tableBox">
        <table id="pointsTable">
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
    </div>
    <button id="clearBtn">Pulisci punti</button>

</div>

<div id="workspace">
    <canvas id="canvas"></canvas>
    <div id="debug"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3>Eliminare punto?</h3>
        <p id="modal-text"></p>

        <div class="modal-actions">
            <button id="cancelBtn">Annulla</button>
            <button id="deleteBtn">Elimina</button>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
