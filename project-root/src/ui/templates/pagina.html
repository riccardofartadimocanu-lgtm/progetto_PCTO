<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Editor Breton</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ========================= SIDEBAR ========================= -->
<div class="sidebar">

    <div class="sidebar-title">Editor Breton</div>

    <!-- Metadati sessione -->
    <div class="meta-fields">
        <label>ID Immagine</label>
        <input type="text" id="idImmagine" placeholder="es. IMG-001">
        <label>ID Setup</label>
        <input type="text" id="idSetup" placeholder="es. SETUP-A">
    </div>

    <!-- Toolbar bottoni -->
    <div class="toolbar">
        <button id="loadBtn" class="full-width">📂 Carica immagine</button>
        <button id="editBtn">Edit OFF</button>
        <button id="modeBtn">📐 Modalità: Pixel</button>
        <button id="saveBtn">💾 Salva</button>
        <button id="loadSaveBtn">📥 Carica salvataggio</button>
        <button id="exportBtn">📤 Esporta JSON</button>
        <button id="exportCsvBtn">📊 Esporta CSV</button>
        <button id="clearBtn">🗑 Pulisci punti</button>
        <button id="calibrateBtn" class="full-width">🔧 Calibra immagine</button>
        <input type="file" id="fileInput" hidden>
    </div>

    <!-- Tabella punti -->
    <div class="tableBox">
        <table id="pointsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Xp</th>
                    <th>Yp</th>
                    <th>Xm</th>
                    <th>Ym</th>
                    <th>Stato</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<!-- ========================= WORKSPACE ========================= -->
<div id="workspace">
    <canvas id="canvas"></canvas>
    <div id="debug"></div>
    <div id="cursorCoords">X: 0 Y: 0</div>
</div>

<!-- ========================= MODAL: azioni punto ========================= -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3>Gestione punto</h3>

        <p id="modal-text"></p>

        <div class="modal-actions">
            <button id="cancelBtn" class="btn-secondary">
                Annulla
            </button>

            <button id="editPointBtn" class="btn-primary">
                Modifica
            </button>

            <button id="deleteBtn" class="btn-danger">
                Elimina
            </button>
        </div>
    </div>
</div>
<!-- ========================= MODAL: nuovo/edit punto ========================= -->
<div id="pointModal" class="modal hidden">
    <div class="modal-content">
        <h3>Coordinate reali</h3>
        <label id="labelXm">Xm — coordinata pixel (intero)</label>
        <input id="xmInput" type="number" step="1" placeholder="es. 320">
        <label id="labelYm">Ym — coordinata pixel (intero)</label>
        <input id="ymInput" type="number" step="1" placeholder="es. 240">
        <div id="errorPopup" class="hidden error-popup"></div>
        <div class="modal-actions">
            <button id="cancelPointBtn" class="btn-secondary">Annulla</button>
            <button id="savePointBtn" class="btn-primary">Conferma</button>
        </div>
    </div>
</div>
<!-- Spinner calibrazione -->
<div id="calibSpinner" class="hidden">
    <div class="spinner-inner">
        <div class="spinner-ring"></div>
        <span>Calibrazione in corso…</span>
    </div>
</div>

<!-- MODAL: risultato calibrazione -->
<div id="calibModal" class="modal hidden">
    <div class="calib-modal-content">

        <div class="calib-modal-header">
            <h3>📐 Immagine Calibrata</h3>
            <div class="calib-modal-actions">
                <button id="downloadCalibBtn" class="btn-primary">⬇ Scarica PNG</button>
                <button id="closeCalibBtn"    class="btn-secondary">✕ Chiudi</button>
            </div>
        </div>

        <div class="calib-canvas-wrapper">
            <canvas id="calibCanvas"></canvas>
        </div>

        <div class="calib-info-bar" id="calibInfo">—</div>

    </div>
</div>
<script src="/static/script.js"></script>
</body>
</html>
